<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#ffffff" id="warna-tema">
<title>Foto nota · Portal Asia Group</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="stylesheet" href="kamera.css?v=6">
</head>
<body>
<svg class="ikon-sumber" aria-hidden="true" focusable="false">
  <symbol id="i-kamera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
  <symbol id="i-sampah" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-cek" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-petir" viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/></symbol>
  <symbol id="i-petir-mati" viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12L13 2z"/><path d="M3 3l18 18"/></symbol>
  <symbol id="i-hp" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-mendatar" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1.5"/></symbol>
  <symbol id="i-tegak" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="1.5"/></symbol>
</svg>
<main class="app">

<section id="nota" class="layar layar-nota" aria-label="Foto nota" hidden>
  <header class="atas">
    <div class="atas-baris">
      <button type="button" class="kembali" id="n-kembali">‹ Daftar nota</button>
      <span class="pil-jenis" id="n-jenis"></span>
    </div>
    <h1 class="judul" id="n-judul"></h1>
    <p class="sub" id="n-sub"></p>
  </header>
  <div class="isi isi-nota">
    <div class="keadaan" id="n-keadaan" role="note" hidden>
      <b id="k-judul"></b>
      <span class="k-catatan" id="k-catatan"></span>
      <span class="k-oleh" id="k-oleh"></span>
      <span class="k-aksi" id="k-aksi"></span>
    </div>
    <div class="kartu-portal" id="n-kartu" role="alert" hidden>
      <b id="kartu-judul">Buka lagi dari Portal</b>
      <p id="kartu-isi"></p>
      <button type="button" class="btn" id="t-tutup3">Tutup halaman</button>
      <button type="button" class="btn" id="t-muat-ulang" hidden>Muat ulang</button>
    </div>
    <div class="pita" id="n-pita" role="status" aria-live="polite" hidden></div>
    <div class="slot" id="slot-nota" data-apa="nota"></div>
    <div class="slot" id="slot-barang" data-apa="barang"></div>
  </div>
  <footer class="kaki">
    <button type="button" class="btn primer" id="n-selesai" disabled aria-describedby="n-selesai-ket">Selesai</button>
    <p class="catatan" id="n-selesai-ket">Foto nota dan foto barang dulu.</p>
  </footer>
</section>

<section id="kamera" class="kam" aria-label="Kamera" hidden>
  <header class="kam-atas">
    <button type="button" class="kam-x" id="kam-tutup" aria-label="Tutup kamera, kembali ke nota">✕</button>
    <div class="kam-judul"><b id="kam-apa"></b><span id="kam-kertas"></span></div>
  </header>
  <div class="kam-bidik" id="kam-bidik">
    <video id="kam-video" playsinline muted autoplay></video>
    <div class="kotak-bidik" id="kotak-bidik" aria-hidden="true"><i class="s tl"></i><i class="s tr"></i><i class="s bl"></i><i class="s br"></i></div>
    <div class="kam-panduan" id="kam-panduan">
      <p class="kam-petunjuk" id="kam-petunjuk"></p>
      <div class="kam-bingkai" id="kam-bingkai" role="group" aria-label="Bentuk nota" hidden>
        <button type="button" id="bingkai-mendatar" aria-pressed="true"><svg aria-hidden="true"><use href="#i-mendatar"/></svg>Mendatar</button>
        <button type="button" id="bingkai-tegak" aria-pressed="false"><svg aria-hidden="true"><use href="#i-tegak"/></svg>Tegak</button>
      </div>
    </div>
    <p class="kam-ket" id="kam-ket" role="status" aria-live="polite">Menyalakan kamera…</p>
  </div>
  <div class="kam-bawah">
    <div class="kam-sisi">
      <button type="button" class="kam-alat" id="kam-flash" aria-pressed="true" hidden><svg aria-hidden="true"><use href="#i-petir"/></svg><span>Flash</span></button>
    </div>
    <button type="button" class="kam-rana" id="kam-rana" aria-label="Ambil foto" disabled><i></i></button>
    <div class="kam-sisi">
      <label class="kam-alat"><svg aria-hidden="true"><use href="#i-hp"/></svg><span>Kamera HP</span><input type="file" class="pilih-foto" accept="image/*" capture="environment" aria-label="Pakai kamera bawaan HP"></label>
    </div>
  </div>
</section>

<section id="kirim" class="layar" aria-label="Kirim foto" hidden>
  <header class="atas">
    <button type="button" class="kembali" id="t-kembali" hidden>‹ Kembali</button>
    <h1 class="judul" id="kirim-judul"></h1>
    <p class="sub" id="kirim-sub"></p>
  </header>
  <div class="isi">
    <figure class="kirim-foto" id="kirim-foto"><img id="kirim-img" alt="" hidden></figure>
    <ol class="alur-kirim" id="alur">
      <li data-langkah="1"><i aria-hidden="true"></i><div><b id="langkah1-judul">Merapikan foto…</b></div></li>
      <li data-langkah="2"><i aria-hidden="true"></i><div><b id="langkah2-judul">Mengirim ke Portal…</b><span id="langkah2-ket"></span></div></li>
      <li data-langkah="3"><i aria-hidden="true"></i><div><b id="langkah3-judul">Masuk Laporan harian…</b></div></li>
    </ol>
    <p class="hasil" id="hasil" role="status" aria-live="polite" hidden></p>
    <div class="aksi" id="aksi-ulang" hidden>
      <button type="button" class="btn primer" id="t-kirim-ulang">Kirim ulang</button>
      <button type="button" class="btn" id="t-foto-lagi">Foto ulang</button>
    </div>
    <div class="aksi" id="aksi-tutup" hidden>
      <button type="button" class="btn primer" id="t-tutup">Tutup halaman</button>
    </div>
  </div>
</section>

<section id="tolak" class="layar" aria-label="Kamera belum menyala" hidden>
  <header class="atas">
    <button type="button" class="kembali" id="t-tolak-kembali">‹ Kembali</button>
    <h1 class="judul" id="tolak-judul">Kamera belum menyala</h1>
    <p class="sub" id="tolak-sub"></p>
  </header>
  <div class="isi">
    <p class="hasil tunggu" id="tolak-isi"></p>
    <div class="aksi">
      <label class="btn primer unggah">Pakai kamera bawaan HP<input type="file" class="pilih-foto" accept="image/*" capture="environment"></label>
      <button type="button" class="btn" id="t-coba-kamera">Coba nyalakan kamera lagi</button>
    </div>
  </div>
</section>

<section id="pesan" class="layar" aria-label="Foto nota" hidden>
  <header class="atas">
    <h1 class="judul" id="pesan-judul">Foto nota</h1>
  </header>
  <div class="isi">
    <p class="hasil info" id="pesan-isi"></p>
    <div class="aksi"><button type="button" class="btn primer" id="t-tutup2">Tutup halaman</button></div>
  </div>
</section>

<section id="tunggu" class="layar" aria-label="Menunggu foto terkirim" hidden>
  <header class="atas">
    <h1 class="judul" id="tunggu-judul">Menunggu foto terkirim…</h1>
  </header>
  <div class="isi">
    <p class="hasil tunggu" id="tunggu-isi" role="status" aria-live="polite"></p>
    <div class="aksi"><button type="button" class="btn" id="t-batal-tunggu">‹ Kembali ke nota</button></div>
  </div>
</section>

<div class="pop" id="tanya" hidden>
  <div class="pop-kotak" role="alertdialog" aria-modal="true" aria-labelledby="tanya-judul" aria-describedby="tanya-isi">
    <h2 id="tanya-judul"></h2>
    <p id="tanya-isi"></p>
    <div class="pop-dua">
      <button type="button" class="btn" id="tanya-batal">Batal</button>
      <button type="button" class="btn bahaya" id="tanya-hapus">Hapus</button>
    </div>
  </div>
</div>

<div class="pop" id="pop" hidden>
  <div class="pop-kotak" role="alertdialog" aria-modal="true" aria-labelledby="pop-judul" aria-describedby="pop-isi">
    <h2 id="pop-judul"></h2>
    <p id="pop-isi"></p>
    <button type="button" class="btn primer" id="pop-tombol"></button>
  </div>
</div>

</main>
<script src="kamera.js?v=6"></script>
</body>
</html>
